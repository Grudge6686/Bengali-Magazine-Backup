<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বাংলা পত্র-পত্রিকা সংগ্রহ</title>
<style>
:root{
 --bg:#f5f7fb;--panel:#fff;--panel2:#f0f3f9;--text:#172033;--muted:#667085;
 --border:#dfe4ec;--primary:#6750e8;--primary2:#8b5cf6;--shadow:0 10px 30px rgba(31,41,55,.08);
 --green:#16a34a;--red:#dc2626;--blue:#2563eb;--yellow:#d97706;--gray:#64748b;
}
[data-theme="dark"]{
 --bg:#0d1117;--panel:#151b24;--panel2:#1d2633;--text:#edf2f7;--muted:#9aa7b8;
 --border:#2c3747;--shadow:0 10px 35px rgba(0,0,0,.3);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh}
.logo{font-size:20px;font-weight:800;padding:8px 10px 18px}.logo small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--text);padding:11px 12px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:linear-gradient(135deg,rgba(103,80,232,.14),rgba(139,92,246,.08));color:var(--primary)}
.main{flex:1;min-width:0;padding:24px;max-width:1600px;margin:auto;width:100%}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.topbar h1{margin:0;font-size:27px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 13px}.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:#fff;background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.stat-label{color:var(--muted);font-size:13px}.stat-num{font-size:28px;font-weight:800;margin-top:5px}.stat-icon{font-size:24px;float:right}.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.progress{height:10px;background:var(--panel2);border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#ec4899);border-radius:20px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:220px}.input,.select,.textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(103,80,232,.12)}
.filters{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:8px;margin-bottom:15px}.filter-label{font-size:11px;color:var(--muted);margin:0 0 4px 2px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{padding:10px 11px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}.table th{font-size:12px;color:var(--muted);background:var(--panel2);position:sticky;top:0}.table tr:last-child td{border-bottom:0}.cover-sm{width:42px;height:58px;object-fit:cover;border-radius:6px;background:var(--panel2);display:block}.cover-placeholder{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;white-space:nowrap}.owned{background:rgba(22,163,74,.13);color:var(--green)}.missing{background:rgba(220,38,38,.13);color:var(--red)}.wanted{background:rgba(37,99,235,.13);color:var(--blue)}.partial{background:rgba(217,119,6,.13);color:var(--yellow)}.unknown{background:rgba(100,116,139,.13);color:var(--gray)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px}.mag-card{overflow:hidden;padding:0}.mag-cover{height:220px;width:100%;object-fit:cover;background:var(--panel2)}.mag-cover.placeholder{display:flex;align-items:center;justify-content:center;font-size:46px}.mag-body{padding:12px}.mag-title{font-weight:750;line-height:1.25}.muted{color:var(--muted)}.small{font-size:12px}
.list{display:grid;gap:8px}.list-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.section-title{font-size:18px;font-weight:800;margin:0 0 12px}.section-title span{font-size:12px;color:var(--muted);font-weight:500}
.bar-row{margin:11px 0}.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.bar{height:8px;background:var(--panel2);border-radius:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#ec4899);border-radius:9px}
.empty{text-align:center;padding:55px 20px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-box{background:var(--panel);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cover-preview{width:90px;height:120px;object-fit:cover;border-radius:8px;background:var(--panel2);border:1px solid var(--border)}
.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:white;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;z-index:50}.toast.show{opacity:1;transform:none}
.pagination{display:flex;justify-content:center;align-items:center;gap:5px;margin-top:15px;flex-wrap:wrap}.pagination button{min-width:36px}.view-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}.view-toggle button{border:0;border-right:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 10px}.view-toggle button:last-child{border:0}.view-toggle button.active{background:var(--primary);color:white}
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:var(--panel2);border-radius:12px;padding:12px}.mini b{font-size:20px}
@media(max-width:1000px){.sidebar{width:205px}.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.app{display:block}.sidebar{width:auto;height:auto;position:relative;border-right:0;border-bottom:1px solid var(--border)}.nav{grid-template-columns:repeat(4,1fr);overflow:auto}.nav button{font-size:12px;text-align:center;padding:9px 5px}.main{padding:14px}.topbar{align-items:flex-start;flex-direction:column}.stats,.two,.form-grid,.kpi-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">📚 বাংলা সংগ্রহ<small>Personal Magazine Library</small></div>
  <nav class="nav">
    <button data-page="dashboard">🏠 ড্যাশবোর্ড</button>
    <button data-page="collection">📚 সংগ্রহ</button>
    <button data-page="publications">🗂️ প্রকাশনা</button>
    <button data-page="missing">🔴 অনুপস্থিত</button>
    <button data-page="wanted">🔵 চাই</button>
    <button data-page="categories">🏷️ বিভাগ</button>
    <button data-page="backup">💾 Import / Export</button>
    <button data-page="settings">⚙️ সেটিংস</button>
  </nav>
</aside>
<main class="main">
 <div class="topbar">
   <div><h1 id="pageTitle">ড্যাশবোর্ড</h1><div class="muted small" id="pageSub">তোমার বাংলা পত্র-পত্রিকা ও পূজাবার্ষিকীর ব্যক্তিগত সংগ্রহ</div></div>
   <div class="actions"><button class="btn" id="themeBtn">🌙 / ☀️</button><button class="btn primary" id="addBtn">＋ নতুন item</button></div>
 </div>
 <div id="appContent"></div>
</main>
</div>

<div class="modal" id="itemModal">
 <div class="modal-box">
  <div class="modal-head"><h2 id="modalTitle">নতুন item</h2><button class="btn" onclick="closeModal()">✕</button></div>
  <form id="itemForm">
   <input type="hidden" id="editId">
   <div class="form-grid">
    <div class="field"><label>Title *</label><input class="input" id="title" required placeholder="যেমন: Anandamela Pujabarshiki 2026"></div>
    <div class="field"><label>Magazine / Publication Name *</label><input class="input" id="publication" required placeholder="Anandamela"></div>
    <div class="field"><label>Category *</label><select class="select" id="category"></select></div>
    <div class="field"><label>Year</label><input class="input" id="year" type="number" min="1800" max="2200" placeholder="2026"></div>
    <div class="field"><label>Bengali Year</label><input class="input" id="bengaliYear" placeholder="1433"></div>
    <div class="field"><label>Issue / Edition</label><input class="input" id="issue" placeholder="Pujabarshiki"></div>
    <div class="field"><label>Publication Date</label><input class="input" id="pubDate" type="date"></div>
    <div class="field"><label>Publisher</label><input class="input" id="publisher"></div>
    <div class="field"><label>Format</label><select class="select" id="format"></select></div>
    <div class="field"><label>Pages</label><input class="input" id="pages" type="number" min="0"></div>
    <div class="field"><label>Price</label><input class="input" id="price" type="number" min="0" step="0.01"></div>
    <div class="field">
  <label>Cover Image</label>
  <input class="input" id="cover" type="file" accept="image/*">
  <input class="input" id="coverUrl" type="url" placeholder="Web image URL (https://...)" style="margin-top:7px">
  <div class="small muted" style="margin-top:4px">Upload an image or paste a direct web image URL.</div>
</div>
    <div class="field full"><label>Notes</label><textarea class="textarea" id="notes" rows="4" placeholder="নিজের নোট..."></textarea></div>
   </div>
   <div id="coverCurrent" style="margin-top:12px"></div>
   <div class="modal-foot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>
 </div>
</div>

<div class="modal" id="quickModal">
 <div class="modal-box" style="max-width:620px">
  <div class="modal-head"><h2>⚡ Quick Add</h2><button class="btn" onclick="document.getElementById('quickModal').classList.remove('show')">✕</button></div>
  <p class="muted">এই format ব্যবহার করো: <b>Publication | Category/Issue | Year | Format</b></p>
  <input class="input" id="quickInput" placeholder="Anandamela | Pujabarshiki | 2026 | PDF">
  <div class="modal-foot"><button class="btn" onclick="parseQuick()">Continue</button></div>
 </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" hidden accept=".json,.csv,application/json,text/csv">
<input type="file" id="coverPicker" hidden accept="image/*">

<script>
const DB_NAME='BengaliMagazineCollectionDB', DB_VERSION=1, STORE='items';
let db, state={page:'dashboard',items:[],view:localStorage.getItem('bm_view')||'table',query:'',filters:{},sort:'updated-desc',pageNo:1,pageSize:Number(localStorage.getItem('bm_pageSize')||50)};
const cats=['পূজাবার্ষিকী','সাপ্তাহিক','পাক্ষিক','মাসিক','অন্যান্য'];
const subs=['','শিশু','কিশোর','কিশোর-কিশোরী'];
const statuses=[['owned','🟢 Owned'],['partial','🟡 Partially Owned'],['missing','🔴 Missing'],['wanted','🔵 Wanted'],['unknown','⚪ Unknown']];
const formats=['PDF','Physical','Both'];
const conditions=['','New','Like New','Good','Fair','Poor'];
const $=id=>document.getElementById(id);

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('publication','publication');s.createIndex('year','year');s.createIndex('status','status');}};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function allItems(){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function putItem(x){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delItem(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function pct(a,b){return b?Math.round(a/b*1000)/10:0}
function statusLabel(s){return (statuses.find(x=>x[0]===s)||statuses[4])[1]}
function statusClass(s){return s||'unknown'}
function imgHtml(x,small=false){if(x.cover||x.coverUrl){return `<img class="${small?'cover-sm':'mag-cover'}" src="${esc(x.cover||x.coverUrl)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="${small?'cover-sm':'mag-cover'} placeholder" style="display:none">📚</div>`}return `<div class="${small?'cover-sm':'mag-cover'} placeholder">📚</div>`}
function saveTheme(){localStorage.setItem('bm_theme',document.documentElement.dataset.theme||'light')}
function applyTheme(){const t=localStorage.getItem('bm_theme')||'light';document.documentElement.dataset.theme=t}

function setupFormOptions(){
 $('category').innerHTML=cats.map(x=>`<option>${x}</option>`).join('');
 $('format').innerHTML=formats.map(x=>`<option>${x}</option>`).join('');
}

function stats(){
 const a=state.items,total=a.length,owned=a.filter(x=>x.status==='owned').length,missing=a.filter(x=>x.status==='missing').length,wanted=a.filter(x=>x.status==='wanted').length,partial=a.filter(x=>x.status==='partial').length;
 const pdf=a.filter(x=>x.format==='PDF'||x.format==='Both').length,physical=a.filter(x=>x.format==='Physical'||x.format==='Both').length,both=a.filter(x=>x.format==='Both').length;
 return {total,owned,missing,wanted,partial,pdf,physical,both,progress:pct(owned,total)}
}
function statCard(icon,label,num){return `<div class="card"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-num">${num}</div></div>`}

function dashboard(){
 const s=stats(), byPub={};state.items.forEach(x=>byPub[x.publication]=(byPub[x.publication]||0)+1);
 const pubs=Object.entries(byPub).sort((a,b)=>b[1]-a[1]).slice(0,8), recent=[...state.items].sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,7), missing=state.items.filter(x=>x.status==='missing'||x.status==='partial').slice(0,7);
 return `<div class="grid stats">
 ${statCard('📚','মোট item',s.total)}${statCard('🟢','Owned',s.owned)}${statCard('🔴','Missing',s.missing)}${statCard('🔵','Wanted',s.wanted)}
 </div>
 <div class="grid two">
  <div class="card"><h3 class="section-title">📊 Collection Progress</h3><div style="display:flex;justify-content:space-between;margin-bottom:7px"><b>${s.progress}%</b><span class="muted">${s.owned}/${s.total} owned</span></div><div class="progress"><i style="width:${s.progress}%"></i></div>
   <div class="kpi-grid" style="margin-top:15px"><div class="mini"><span class="muted small">PDF</span><br><b>${s.pdf}</b></div><div class="mini"><span class="muted small">Physical</span><br><b>${s.physical}</b></div><div class="mini"><span class="muted small">Both</span><br><b>${s.both}</b></div></div>
  </div>
  <div class="card"><h3 class="section-title">🗂️ প্রকাশনা</h3>${pubs.length?pubs.map(([p,n])=>`<div class="bar-row"><div class="bar-head"><span>${esc(p)}</span><b>${n}</b></div><div class="bar"><i style="width:${pct(n,s.total)}%"></i></div></div>`).join(''):'<div class="empty">এখনও কোনো item নেই</div>'}</div>
 </div>
 <div class="grid two" style="margin-top:14px">
  <div class="card"><h3 class="section-title">🆕 Recently Added / Updated</h3>${recent.length?`<div class="list">${recent.map(x=>miniRow(x)).join('')}</div>`:'<div class="empty"><strong>📚 সংগ্রহ শুরু করো</strong>প্রথম item যোগ করো।</div>'}</div>
  <div class="card"><h3 class="section-title">🔴 Missing / Partial</h3>${missing.length?`<div class="list">${missing.map(x=>miniRow(x)).join('')}</div>`:'<div class="empty"><strong>দারুণ!</strong>Missing বা Partial item নেই।</div>'}</div>
 </div>`;
}
function miniRow(x){return `<div class="list-row">${imgHtml(x,true)}<div style="min-width:0;flex:1"><b>${esc(x.title)}</b><div class="small muted">${esc(x.publication)} ${x.year?'• '+x.year:''}</div></div><span class="badge ${statusClass(x.status)}">${statusLabel(x.status)}</span></div>`}

function filtered(){
 let a=[...state.items],f=state.filters||{},q=state.query.trim().toLowerCase();
 if(q)a=a.filter(x=>Object.values(x).some(v=>typeof v==='string'&&v.toLowerCase().includes(q)));
 if(f.category)a=a.filter(x=>x.category===f.category);if(f.subcategory)a=a.filter(x=>x.subcategory===f.subcategory);if(f.publication)a=a.filter(x=>x.publication===f.publication);if(f.year)a=a.filter(x=>String(x.year)===String(f.year));if(f.status)a=a.filter(x=>x.status===f.status);if(f.format)a=a.filter(x=>x.format===f.format);
 const [key,dir]=(state.sort||'updated-desc').split('-');a.sort((x,y)=>{let A=x[key]??'',B=y[key]??'';if(key==='year'||key==='createdAt'||key==='updatedAt'){A=Number(A)||0;B=Number(B)||0}else{A=String(A).toLowerCase();B=String(B).toLowerCase()}return (A>B?1:A<B?-1:0)*(dir==='desc'?-1:1)});return a;
}
function filtersHtml(){
 const pubs=[...new Set(state.items.map(x=>x.publication).filter(Boolean))].sort(),years=[...new Set(state.items.map(x=>x.year).filter(Boolean))].sort((a,b)=>b-a);
 return `<div class="filters">
 <div><div class="filter-label">Category</div><select class="select" onchange="setFilter('category',this.value)"><option value="">সব</option>${cats.map(x=>`<option ${state.filters.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><div class="filter-label">Subcategory</div><select class="select" onchange="setFilter('subcategory',this.value)"><option value="">সব</option>${subs.filter(Boolean).map(x=>`<option ${state.filters.subcategory===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><div class="filter-label">Publication</div><select class="select" onchange="setFilter('publication',this.value)"><option value="">সব</option>${pubs.map(x=>`<option ${state.filters.publication===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
 <div><div class="filter-label">Year</div><select class="select" onchange="setFilter('year',this.value)"><option value="">সব</option>${years.map(x=>`<option ${String(state.filters.year)===String(x)?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><div class="filter-label">Status</div><select class="select" onchange="setFilter('status',this.value)"><option value="">সব</option>${statuses.map(x=>`<option value="${x[0]}" ${state.filters.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div>
 <div><div class="filter-label">Format</div><select class="select" onchange="setFilter('format',this.value)"><option value="">সব</option>${formats.map(x=>`<option ${state.filters.format===x?'selected':''}>${x}</option>`).join('')}</select></div>
 </div>`;
}
function collection(){
 const a=filtered(),start=(state.pageNo-1)*state.pageSize,rows=a.slice(start,start+state.pageSize);
 return `<div class="toolbar"><input class="input search" id="searchBox" value="${esc(state.query)}" placeholder="🔎 Title, publication, year, tag, notes..." oninput="state.query=this.value;state.pageNo=1;renderCollectionOnly()">
 <select class="select" style="width:190px" onchange="state.sort=this.value;renderCollectionOnly()"><option value="updated-desc">Recently updated</option><option value="created-desc">Recently added</option><option value="title-asc">Title A→Z</option><option value="title-desc">Title Z→A</option><option value="year-desc">Year ↓</option><option value="year-asc">Year ↑</option><option value="publication-asc">Publication A→Z</option></select>
 <div class="view-toggle"><button class="${state.view==='table'?'active':''}" onclick="setView('table')">☷</button><button class="${state.view==='gallery'?'active':''}" onclick="setView('gallery')">▦</button><button class="${state.view==='list'?'active':''}" onclick="setView('list')">☰</button></div><button class="btn" onclick="openQuick()">⚡ Quick Add</button><button class="btn" onclick="clearFilters()">Clear Filters</button></div>
 ${filtersHtml()}
 <div class="muted small" style="margin-bottom:8px">${a.length}টি result</div>
 ${state.view==='table'?tableView(rows):state.view==='gallery'?galleryView(rows):listView(rows)}
 ${pagination(a.length)}`;
}
function tableView(rows){if(!rows.length)return empty('কোনো item পাওয়া যায়নি','Search বা filter পরিবর্তন করে দেখো।');return `<div class="table-wrap"><table class="table"><thead><tr><th></th><th>Title</th><th>Publication</th><th>Year</th><th>Issue</th><th>Status</th><th>Format</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${imgHtml(x,true)}</td><td><b>${esc(x.title)}</b><div class="small muted">${esc(x.category||'')}</div></td><td>${esc(x.publication)}</td><td>${esc(x.year||'')}</td><td>${esc(x.issue||'')}</td><td><span class="badge ${statusClass(x.status)}">${statusLabel(x.status)}</span></td><td>${esc(x.format||'')}</td><td><button class="btn" onclick="editItem('${x.id}')">Edit</button> <button class="btn" onclick="duplicateItem('${x.id}')">Copy</button> <button class="btn" onclick="deleteItem('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function galleryView(rows){if(!rows.length)return empty('কোনো item পাওয়া যায়নি','Search বা filter পরিবর্তন করে দেখো।');return `<div class="gallery">${rows.map(x=>`<div class="card mag-card">${imgHtml(x)}<div class="mag-body"><div class="mag-title">${esc(x.title)}</div><div class="small muted">${esc(x.publication)} ${x.year?'• '+x.year:''}</div><div style="margin-top:8px"><span class="badge ${statusClass(x.status)}">${statusLabel(x.status)}</span> <span class="badge unknown">${esc(x.format||'')}</span></div><div class="actions" style="margin-top:9px"><button class="btn" onclick="editItem('${x.id}')">Edit</button><button class="btn" onclick="deleteItem('${x.id}')">Delete</button></div></div></div>`).join('')}</div>`}
function listView(rows){if(!rows.length)return empty('কোনো item পাওয়া যায়নি','Search বা filter পরিবর্তন করে দেখো।');return `<div class="list">${rows.map(x=>`<div class="list-row">${imgHtml(x,true)}<div style="flex:1"><b>${esc(x.title)}</b><div class="small muted">${esc(x.publication)} • ${esc(x.year||'')} • ${esc(x.issue||'')}</div><div style="margin-top:5px"><span class="badge ${statusClass(x.status)}">${statusLabel(x.status)}</span> <span class="badge unknown">${esc(x.format||'')}</span></div></div><button class="btn" onclick="editItem('${x.id}')">Edit</button></div>`).join('')}</div>`}
function empty(a,b){return `<div class="card empty"><strong>${a}</strong>${b}</div>`}
function pagination(n){const pages=Math.max(1,Math.ceil(n/state.pageSize));state.pageNo=Math.min(state.pageNo,pages);let p='';for(let i=1;i<=Math.min(pages,7);i++)p+=`<button class="btn ${i===state.pageNo?'primary':''}" onclick="state.pageNo=${i};renderCollectionOnly()">${i}</button>`;return `<div class="pagination"><button class="btn" ${state.pageNo<=1?'disabled':''} onclick="state.pageNo--;renderCollectionOnly()">‹</button>${p}<button class="btn" ${state.pageNo>=pages?'disabled':''} onclick="state.pageNo++;renderCollectionOnly()">›</button></div>`}

function publications(){
 const map={};state.items.forEach(x=>{const p=x.publication||'Unnamed';map[p]??=[];map[p].push(x)});
 const list=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
 return `<div class="card"><h3 class="section-title">🗂️ Publications <span>${list.length}টি</span></h3>${list.length?`<div class="gallery">${list.map(([p,a])=>{const o=a.filter(x=>x.status==='owned').length;return `<div class="card"><div style="font-size:26px">📚</div><h3 style="margin:7px 0">${esc(p)}</h3><div class="muted small">${a.length} items • ${o} owned</div><div class="progress" style="margin:8px 0"><i style="width:${pct(o,a.length)}%"></i></div><button class="btn js-view-publication" data-publication="${esc(p)}">View issues</button></div>`}).join('')}</div>`:empty('এখনও কোনো publication নেই','Collection থেকে item যোগ করো।')}</div>`;
}
function missingPage(wanted=false){
 const arr=state.items.filter(x=>wanted?x.status==='wanted':(x.status==='missing'||x.status==='partial'));
 return `<div class="card"><div class="toolbar"><div style="flex:1"><h3 class="section-title">${wanted?'🔵 Wanted':'🔴 Missing / Partial'} <span>${arr.length}টি</span></h3></div><button class="btn" onclick="state.page='collection';state.query='';state.filters={status:${wanted?JSON.stringify('wanted'):JSON.stringify('missing')}};render()">Open in Collection</button></div>${arr.length?`<div class="list">${arr.sort((a,b)=>(a.year||0)-(b.year||0)).map(x=>miniRow(x)).join('')}</div>`:empty(wanted?'কোনো Wanted item নেই':'কোনো Missing item নেই',wanted?'নতুন item-কে Wanted হিসেবে mark করতে পারো।':'তোমার collection সম্পূর্ণ!')}</div>`;
}
function categoriesPage(){
 const counts={};state.items.forEach(x=>counts[x.category||'অনির্ধারিত']=(counts[x.category||'অনির্ধারিত']||0)+1);
 return `<div class="grid two">${cats.map(c=>`<div class="card"><div style="font-size:28px">🏷️</div><h3>${c}</h3><div class="stat-num">${counts[c]||0}</div><div class="muted small">items</div><button class="btn js-view-category" style="margin-top:10px" data-category="${esc(c)}">এই বিভাগ দেখুন</button></div>`).join('')}</div>`;
}
function backupPage(){
 return `<div class="grid two">
 <div class="card"><h3 class="section-title">💾 Backup</h3><p class="muted">সব collection data JSON হিসেবে backup করো।</p><div class="actions"><button class="btn primary" onclick="exportJSON()">Export JSON</button><button class="btn" onclick="triggerImport('json')">Import JSON</button></div><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><p class="muted">Spreadsheet-এর জন্য CSV ব্যবহার করতে পারো।</p><div class="actions"><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="triggerImport('csv')">Import CSV</button></div></div>
 <div class="card"><h3 class="section-title">🛡️ Backup advice</h3><p>তোমার IndexedDB browser-এর মধ্যে local data হিসেবে থাকে। গুরুত্বপূর্ণ collection-এর JSON backup নিয়মিত আলাদা drive/cloud-এ রাখো।</p><div class="mini"><b>${state.items.length}</b><br><span class="muted small">বর্তমান records</span></div></div></div>`;
}
function settingsPage(){
 return `<div class="grid two"><div class="card"><h3 class="section-title">🎨 Appearance</h3><p class="muted">Theme: <b>${document.documentElement.dataset.theme==='dark'?'Dark':'Light'}</b></p><button class="btn" onclick="toggleTheme()">🌙 / ☀️ Toggle Theme</button><hr style="border:0;border-top:1px solid var(--border);margin:18px 0"><label class="field"><span class="muted small">Items per page</span><select class="select" onchange="state.pageSize=Number(this.value);localStorage.setItem('bm_pageSize',this.value);state.pageNo=1;render()"><option ${state.pageSize===25?'selected':''}>25</option><option ${state.pageSize===50?'selected':''}>50</option><option ${state.pageSize===100?'selected':''}>100</option><option ${state.pageSize===200?'selected':''}>200</option></select></label></div>
 <div class="card"><h3 class="section-title">🛡️ Database</h3><div class="mini"><b>${state.items.length}</b><br><span class="muted small">records in IndexedDB</span></div><button class="btn" style="margin-top:12px" onclick="exportJSON()">Quick Backup</button><button class="btn danger" style="margin:12px 0 0 6px" onclick="clearAll()">Clear All Data</button></div></div>`;
}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 const titles={dashboard:'ড্যাশবোর্ড',collection:'সংগ্রহ',publications:'প্রকাশনা',missing:'অনুপস্থিত',wanted:'চাই',categories:'বিভাগ',backup:'Import / Export',settings:'সেটিংস'};
 $('pageTitle').textContent=titles[state.page]||'ড্যাশবোর্ড';
 const content=state.page==='dashboard'?dashboard():state.page==='collection'?collection():state.page==='publications'?publications():state.page==='missing'?missingPage():state.page==='wanted'?missingPage(true):state.page==='categories'?categoriesPage():state.page==='backup'?backupPage():settingsPage();
 $('appContent').innerHTML=content;
}
function renderCollectionOnly(){$('appContent').innerHTML=collection();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page))}
function setView(v){state.view=v;localStorage.setItem('bm_view',v);renderCollectionOnly()}
function setFilter(k,v){state.filters[k]=v;state.pageNo=1;renderCollectionOnly()}
function clearFilters(){state.filters={};state.query='';state.pageNo=1;renderCollectionOnly()}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';saveTheme()}
function openQuick(){$('quickModal').classList.add('show');$('quickInput').value='';$('quickInput').focus()}
function closeModal(){$('itemModal').classList.remove('show')}
function fillForm(x){
 $('editId').value=x?.id||'';$('title').value=x?.title||'';$('publication').value=x?.publication||'';$('category').value=x?.category||cats[0];$('year').value=x?.year||'';$('bengaliYear').value=x?.bengaliYear||'';$('issue').value=x?.issue||'';$('pubDate').value=x?.pubDate||'';$('publisher').value=x?.publisher||'';$('format').value=x?.format||'PDF';$('pages').value=x?.pages||'';$('price').value=x?.price||'';$('notes').value=x?.notes||'';$('cover').value='';$('coverUrl').value=x?.coverUrl||'';$('coverCurrent').innerHTML=(x?.cover||x?.coverUrl)?`<div class="small muted">Current cover</div>${imgHtml(x,true)}`:'';
}
function openAdd(prefill={}){fillForm(prefill);$('modalTitle').textContent='নতুন item';$('itemModal').classList.add('show')}
function editItem(id){const x=state.items.find(x=>x.id===id);if(!x)return;fillForm(x);$('modalTitle').textContent='Edit item';$('itemModal').classList.add('show')}
async function duplicateItem(id){const x=state.items.find(x=>x.id===id);if(!x)return;const y={...x,id:uid(),title:x.title+' (Copy)',createdAt:Date.now(),updatedAt:Date.now()};await putItem(y);await reload();toast('Duplicate তৈরি হয়েছে')}
async function deleteItem(id){const x=state.items.find(x=>x.id===id);if(!x)return;if(!confirm(`"${x.title}" delete করবে? এই action undo করা যাবে না.`))return;await delItem(id);await reload();toast('Item deleted')}
function fileToData(file){return new Promise((res,rej)=>{if(!file)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
$('itemForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('editId').value||uid(),old=state.items.find(x=>x.id===id),cover=await fileToData($('cover').files[0]);const x={id,title:$('title').value.trim(),publication:$('publication').value.trim(),category:$('category').value,subcategory:old?.subcategory||'',year:Number($('year').value)||'',bengaliYear:$('bengaliYear').value.trim(),issue:$('issue').value.trim(),pubDate:$('pubDate').value,publisher:$('publisher').value.trim(),status:old?.status||'owned',format:$('format').value,condition:old?.condition||'',pdfPath:old?.pdfPath||'',cloudUrl:old?.cloudUrl||'',pages:Number($('pages').value)||'',price:Number($('price').value)||'',tags:old?.tags||'',notes:$('notes').value.trim(),cover:cover||old?.cover||'',coverUrl:$('coverUrl').value.trim(),createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};if(!x.title||!x.publication)return;await putItem(x);closeModal();await reload();toast(old?'Item updated':'Item added')});
function parseQuick(){const p=$('quickInput').value.split('|').map(x=>x.trim());if(!p[0])return toast('Publication দরকার');const [pub,issue,year,format]=p;openAdd({publication:pub,title:issue&&year?pub+' '+issue+' '+year:pub,category:issue?.toLowerCase().includes('puja')||issue?.includes('পূজা')||issue?.toLowerCase().includes('pujabarshiki')?'পূজাবার্ষিকী':'অন্যান্য',issue:issue||'',year:Number(year)||'',format:['PDF','Physical','Both'].includes(format)?format:'PDF',status:'owned'});$('quickModal').classList.remove('show')}

function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
const cols=['title','publication','category','subcategory','year','bengaliYear','issue','pubDate','publisher','status','format','condition','pdfPath','cloudUrl','pages','price','tags','notes','createdAt','updatedAt'];
function exportCSV(){const lines=[cols.join(',')].concat(state.items.map(x=>cols.map(k=>csvEscape(x[k])).join(',')));download(new Blob(['\ufeff'+lines.join('\\n')],{type:'text/csv;charset=utf-8'}),'bengali-magazine-collection.csv');toast('CSV exported')}
function exportJSON(){const data={app:'Bengali Magazine Collection Manager',version:1,exportedAt:new Date().toISOString(),items:state.items};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'bengali-magazine-backup.json');toast('JSON backup exported')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function triggerImport(type){$('importFile').accept=type==='json'?'.json,application/json':'.csv,text/csv';$('importFile').dataset.type=type;$('importFile').click()}
$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;const type=e.target.dataset.type;const text=await f.text();try{if(type==='json')await importJSON(text);else await importCSV(text)}catch(err){console.error(err);toast('Import failed: invalid file')}e.target.value=''});
async function importJSON(text){const d=JSON.parse(text),items=Array.isArray(d)?d:d.items;if(!Array.isArray(items))throw Error('bad');const replace=confirm(`JSON-এ ${items.length}টি record আছে।\\nOK = Replace existing data\\nCancel = Merge data`);if(replace){for(const x of state.items)await delItem(x.id)}let n=0;for(const raw of items){if(!raw.title||!raw.publication)continue;const x={...raw,id:raw.id||uid(),createdAt:raw.createdAt||Date.now(),updatedAt:raw.updatedAt||Date.now()};await putItem(x);n++}await reload();toast(`${n}টি record imported`)}
function parseCSVLine(line){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
async function importCSV(text){const lines=text.replace(/^\\ufeff/,'').split(/\\r?\\n/).filter(Boolean);if(lines.length<2)throw Error('bad');const headers=parseCSVLine(lines[0]);const rows=lines.slice(1).map(parseCSVLine);const replace=confirm(`CSV-তে ${rows.length}টি record আছে।\\nOK = Replace existing data\\nCancel = Merge data`);if(replace){for(const x of state.items)await delItem(x.id)}let n=0;for(const r of rows){const x={};headers.forEach((h,i)=>x[h]=r[i]||'');if(!x.title||!x.publication)continue;x.id=x.id||uid();x.year=Number(x.year)||'';x.pages=Number(x.pages)||'';x.price=Number(x.price)||'';x.createdAt=Number(x.createdAt)||Date.now();x.updatedAt=Number(x.updatedAt)||Date.now();await putItem(x);n++}await reload();toast(`${n}টি record imported`)}

async function clearAll(){if(!state.items.length)return;if(!confirm('সব data permanently delete করতে চাও?'))return;if(!confirm('শেষবার নিশ্চিত হও: সব collection data মুছে যাবে।'))return;for(const x of state.items)await delItem(x.id);await reload();toast('সব data cleared')}
async function reload(){state.items=await allItems();render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;state.pageNo=1;state.query='';state.filters={};render()}));
$('addBtn').addEventListener('click',()=>openAdd());
$('themeBtn').addEventListener('click',toggleTheme);
$('itemModal').addEventListener('click',e=>{if(e.target===$('itemModal'))closeModal()});
document.addEventListener('click', function(e){
  const pubBtn = e.target.closest('.js-view-publication');
  if(pubBtn){ e.preventDefault(); state.page='collection'; state.query=''; state.filters={publication:pubBtn.dataset.publication||''}; state.pageNo=1; render(); return; }
  const catBtn = e.target.closest('.js-view-category');
  if(catBtn){ e.preventDefault(); state.page='collection'; state.query=''; state.filters={category:catBtn.dataset.category||''}; state.pageNo=1; render(); return; }
});

(async()=>{applyTheme();setupFormOptions();try{await openDB();await reload()}catch(e){console.error(e);$('appContent').innerHTML=empty('IndexedDB চালু করা যায়নি','Browser storage permission/settings check করো।')}})();
</script>
</body>
</html>
